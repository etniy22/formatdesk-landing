<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Маскот FormatDesk: колдунья Версия со свитком реквизитов и искрой">
  <defs>
    <pattern id="mHatch" width="4.5" height="4.5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#1F3D2E" stroke-width=".9" opacity=".35"/>
    </pattern>
    <pattern id="mHatchD" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1F3D2E" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <!-- тень -->
  <ellipse cx="118" cy="262" rx="62" ry="7" fill="url(#mHatch)"/>

  <!-- плащ: основная форма -->
  <path d="M120 108
           C100 118 88 150 84 190
           C81 218 78 240 74 254
           L166 254
           C162 238 158 214 155 188
           C151 150 140 118 120 108 Z"
        fill="#FFFFFF" stroke="#1F3D2E" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- гравюрная штриховка на плаще (левая тень) -->
  <path d="M120 108 C100 118 88 150 84 190 C81 218 78 240 74 254 L104 254 C102 220 104 160 112 116 Z"
        fill="url(#mHatchD)"/>
  <!-- складки плаща -->
  <g stroke="#1F3D2E" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".75">
    <path d="M112 130 C106 160 103 210 102 250"/>
    <path d="M132 126 C138 158 141 208 142 250"/>
    <path d="M122 128 C122 160 122 210 122 252"/>
  </g>

  <!-- рука со свитком (левая) -->
  <path d="M96 152 C84 146 76 140 70 132" fill="none" stroke="#1F3D2E" stroke-width="2.4" stroke-linecap="round"/>
  <!-- свиток -->
  <g transform="rotate(-14 58 118)">
    <rect x="40" y="100" width="38" height="52" rx="3" fill="#FAF7EF" stroke="#1F3D2E" stroke-width="2.2"/>
    <path d="M46 110h26M46 117h26M46 124h18M46 131h22" stroke="#B9A37F" stroke-width="1.8" stroke-linecap="round"/>
    <!-- валики свитка -->
    <rect x="36" y="97" width="8" height="58" rx="4" fill="#FFFFFF" stroke="#1F3D2E" stroke-width="2"/>
    <rect x="74" y="97" width="8" height="58" rx="4" fill="#FFFFFF" stroke="#1F3D2E" stroke-width="2"/>
  </g>
  <!-- печать на свитке -->
  <circle cx="66" cy="146" r="6.5" fill="#A9502F" stroke="#8F4024" stroke-width="1"/>

  <!-- рука с жезлом (правая, поднята) -->
  <path d="M146 150 C158 142 166 132 172 122" fill="none" stroke="#1F3D2E" stroke-width="2.4" stroke-linecap="round"/>
  <!-- жезл -->
  <path d="M172 122 L196 84" stroke="#5C5749" stroke-width="3" stroke-linecap="round"/>
  <!-- искра на жезле -->
  <path d="M196 62l4.5 12.5 12.5 4.5-12.5 4.5-4.5 12.5-4.5-12.5-12.5-4.5 12.5-4.5z" fill="#D4AF37" stroke="#8F4024" stroke-width=".8"/>
  <path d="M214 84l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#D4AF37" opacity=".8"/>
  <path d="M180 70l1.4 3.8 3.8 1.4-3.8 1.4-1.4 3.8-1.4-3.8-3.8-1.4 3.8-1.4z" fill="#D4AF37" opacity=".6"/>

  <!-- голова -->
  <circle cx="120" cy="92" r="17" fill="#FFFFFF" stroke="#1F3D2E" stroke-width="2.4"/>
  <!-- волосы: волны по бокам -->
  <path d="M104 92 C98 108 100 124 94 136 M104 96 C100 106 102 118 98 130" fill="none" stroke="#1F3D2E" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M136 92 C142 108 140 124 146 136 M136 96 C140 106 138 118 142 130" fill="none" stroke="#1F3D2E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- лицо: глаза-точки, нос, улыбка -->
  <circle cx="114" cy="92" r="1.3" fill="#1F3D2E"/>
  <circle cx="126" cy="92" r="1.3" fill="#1F3D2E"/>
  <path d="M120 94v4" stroke="#1F3D2E" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M115 102q5 4 10 0" fill="none" stroke="#1F3D2E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- шляпа: поля + конус с загнутым кончиком -->
  <path d="M88 84 C100 78 140 78 152 84 C140 90 100 90 88 84 Z" fill="#1F3D2E"/>
  <path d="M96 82 C100 58 108 38 118 26 C124 18 136 16 142 22 C136 22 132 26 130 32 C128 40 136 60 144 82 C132 88 108 88 96 82 Z"
        fill="#FFFFFF" stroke="#1F3D2E" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- штриховка на шляпе -->
  <path d="M100 78 C104 58 110 42 118 30 C112 46 110 64 112 82 Z" fill="url(#mHatchD)"/>
  <!-- лента шляпы -->
  <path d="M100 74 C110 78 130 78 140 74" fill="none" stroke="#A9502F" stroke-width="3" stroke-linecap="round"/>
  <!-- пряжка ленты -->
  <rect x="116" y="70" width="9" height="7" rx="1.5" fill="none" stroke="#D4AF37" stroke-width="1.6"/>

  <!-- пылинки -->
  <circle cx="48" cy="196" r="1.8" fill="#B9A37F"/>
  <circle cx="200" cy="180" r="1.8" fill="#B9A37F"/>
  <path d="M206 218l1.5 4.5 4.5 1.5-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5 4.5-1.5z" fill="#D4AF37" opacity=".7"/>
</svg>

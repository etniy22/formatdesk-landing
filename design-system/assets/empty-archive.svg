<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Архив пуст: открытая коробка с одной папкой">
  <defs>
    <pattern id="hatch2" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1F3D2E" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>

  <!-- папка, выглядывающая из коробки -->
  <path d="M74 62V44a4 4 0 0 1 4-4h16l6 6h26a4 4 0 0 1 4 4v12z" fill="#FAF7EF" stroke="#1F3D2E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M80 52h20" stroke="#B9A37F" stroke-width="2" stroke-linecap="round"/>

  <!-- архивная коробка -->
  <path d="M46 66h108l-8 58H54z" fill="#FFFFFF" stroke="#1F3D2E" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M46 66h108l-2 12H48z" fill="#EFECE2" stroke="#1F3D2E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M54 124l-8-58h12l6 58z" fill="url(#hatch2)" stroke="#1F3D2E" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- бирка -->
  <rect x="82" y="88" width="36" height="18" rx="2.5" fill="#FAF7EF" stroke="#1F3D2E" stroke-width="2"/>
  <path d="M88 95h24M88 100h14" stroke="#B9A37F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- печать-искра на коробке -->
  <circle cx="140" cy="98" r="11" fill="#A9502F"/>
  <path d="M140 91.5l1.7 4.8 4.8 1.7-4.8 1.7-1.7 4.8-1.7-4.8-4.8-1.7 4.8-1.7z" fill="#F7F4ED"/>

  <!-- тень -->
  <ellipse cx="100" cy="132" rx="58" ry="5" fill="url(#hatch2)"/>
</svg>

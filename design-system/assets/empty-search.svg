<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Ничего не найдено: лупа над стопкой приказов">
  <defs>
    <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1F3D2E" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>

  <!-- стопка приказов -->
  <g stroke="#1F3D2E" stroke-width="2" stroke-linejoin="round">
    <rect x="38" y="86" width="88" height="34" rx="3" fill="#EFECE2"/>
    <rect x="42" y="76" width="88" height="34" rx="3" fill="#FAF7EF"/>
    <rect x="46" y="66" width="88" height="34" rx="3" fill="#FFFFFF"/>
  </g>
  <path d="M56 76h50M56 84h34M56 92h42" stroke="#B9A37F" stroke-width="2" stroke-linecap="round"/>

  <!-- тень под стопкой -->
  <ellipse cx="84" cy="126" rx="52" ry="5" fill="url(#hatch)" stroke="none"/>

  <!-- лупа -->
  <circle cx="128" cy="58" r="34" fill="#FFFFFF" stroke="#1F3D2E" stroke-width="2.6"/>
  <circle cx="128" cy="58" r="26" fill="url(#hatch)" stroke="#B9A37F" stroke-width="1.4"/>
  <path d="M150 82l22 22" stroke="#A9502F" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 82l22 22" stroke="#8F4024" stroke-width="6" stroke-linecap="round" opacity=".35"/>

  <!-- искра в лупе: ничего не нашлось, но магия рядом -->
  <path d="M128 44l2.6 7.4 7.4 2.6-7.4 2.6-2.6 7.4-2.6-7.4-7.4-2.6 7.4-2.6z" fill="#D4AF37"/>

  <!-- пылинки -->
  <circle cx="30" cy="52" r="1.8" fill="#B9A37F"/>
  <circle cx="176" cy="34" r="1.8" fill="#B9A37F"/>
  <path d="M22 118l1.5 4.5 4.5 1.5-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5 4.5-1.5z" fill="#D4AF37" opacity=".8"/>
</svg>
